# Opens the Streamlit app every 6 hours so the free Community Cloud does not put it to sleep
# (a sleeping app shows "Wake up" and makes the first pupil wait).
name: keep-awake
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python tools/keep_awake.py
