# Opens the Streamlit app every 3 hours (it sleeps after 12 h without visits; GitHub may delay schedules) so the free Community Cloud does not put it to sleep
# (a sleeping app shows "Wake up" and makes the first pupil wait).
name: keep-awake
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
jobs:
  visit:
    runs-on: ubuntu-24.04   # Playwright browsers do not support ubuntu-latest (26.04) yet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python tools/keep_awake.py
