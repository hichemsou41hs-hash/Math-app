<!doctype html><html><head><meta charset="utf-8"><script src="https://www.geogebra.org/apps/deployggb.js"></script></head>
<body style="margin:0"><div id="g"></div><script>
window.done=false;
new GGBApplet({appName:"3d",width:960,height:540,showToolBar:false,showAlgebraInput:false,showMenuBar:false,
appletOnLoad:function(api){api.evalCommand("A=(0,0,0)");api.evalCommand("c=Cube(A,(2,0,0))");api.evalCommand("s=Sphere((1,1,1),1)");window.api=api;window.done=true;}},true).inject('g');
</script></body></html>
